name: Build X86 MMDVM Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone https://github.com/fndsz/immortalwrt-23.05.4 -b master openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $GITHUB_WORKSPACE/feeds.conf.default ] && mv $GITHUB_WORKSPACE/feeds.conf.default openwrt/feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          cd openwrt
          
          # 使用默认配置作为打底
          make defconfig
          
          # 核心修改：清除默认架构，强行切到 X86_64
          sed -i 's/CONFIG_TARGET_ramips=y/# CONFIG_TARGET_ramips is not set/' .config
          sed -i 's/CONFIG_TARGET_ramips_mt76x8=y/# CONFIG_TARGET_ramips_mt76x8 is not set/' .config
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
          
          # 运行你的脚本注入 MMDVM 相关配置
          chmod +x $GITHUB_WORKSPACE/mmdvmipk.sh
          $GITHUB_WORKSPACE/mmdvmipk.sh
          
          # 刷新并确认最终配置
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-X86-MMDVM-Firmware
          path: openwrt/bin/targets/x86/64/*.img.gz
