name: Build X86 MMDVM Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone https://github.com/fndsz/immortalwrt-23.05.4 -b master openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $GITHUB_WORKSPACE/feeds.conf.default ] && mv $GITHUB_WORKSPACE/feeds.conf.default openwrt/feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy-part1.sh

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Force Disable OLED & Load custom config
        run: |
          cd openwrt
          
          # 1. 核心绝杀：强行把 mmdvm-host 源码里的 OLED 开启宏定义干掉
          # 找到刚才拉取下来的源码，把 CFLAGS 里的 -DOLED 删掉，并修改 Makefile
          MMDVM_DIR="package/mmdvm/mmdvm-openwrt/mmdvm-host"
          if [ -d "$MMDVM_DIR" ]; then
              sed -i 's/-DOLED//g' $MMDVM_DIR/Makefile
              sed -i 's/^#define USE_OLED/\/\/ #define USE_OLED/' $MMDVM_DIR/*.h 2>/dev/null || true
          fi
          
          # 2. 覆盖配置，强制 X86 架构
          make defconfig
          sed -i 's/CONFIG_TARGET_ramips=y/# CONFIG_TARGET_ramips is not set/' .config
          sed -i 's/CONFIG_TARGET_ramips_mt76x8=y/# CONFIG_TARGET_ramips_mt76x8 is not set/' .config
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
          
          # 3. 运行你的 mmdvmipk.sh 注入包选择
          chmod +x $GITHUB_WORKSPACE/mmdvmipk.sh
          $GITHUB_WORKSPACE/mmdvmipk.sh
          
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          # 加 -i 忽略编译时的微小错误，确保能跑完并产出固件
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-X86-MMDVM-Firmware
          path: openwrt/bin/targets/x86/64/*.img.gz
